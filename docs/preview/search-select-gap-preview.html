<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>两行间距对比</title>
<style>
  :root { --ink:#303133; --ink-3:#909399; --ink-4:#c0c4cc; --line:#dcdfe6; --line-soft:#ebeef5; --canvas:#f5f7fa; --canvas-deep:#f0f2f5; --primary:#1890ff; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 28px 36px; background:var(--canvas); color:var(--ink); font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  h1 { font-size:17px; font-weight:600; margin:0 0 4px; }
  p { color:var(--ink-3); font-size:13px; margin:0 0 18px; }
  .row { display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap; }
  .col { width:330px; }
  .label { font-size:12px; color:var(--ink-3); margin-bottom:6px; }
  .input { display:flex; align-items:center; height:36px; padding:0 12px; background:#fff; border:1px solid var(--primary); border-radius:4px; box-shadow:0 0 0 2px rgb(24 144 255 / .2); font-size:14px; }
  .input .value { flex:1; } .input .icon { color:var(--ink-4); font-size:12px; }
  .panel { margin-top:4px; border:1px solid var(--line); border-radius:4px; background:#fff; padding:2px 0;
           box-shadow:0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1); width:max-content; min-width:100%; max-width:420px; }
  .option { padding:6px 12px; background:var(--canvas-deep); }
  .main { font-size:14px; font-weight:600; white-space:nowrap; }
  .hint { font-size:12px; color:var(--ink-3); white-space:nowrap; }
  .a .main + .hint { margin-top:2px; }
  .b .main + .hint { margin-top:4px; }
  .c .main + .hint { margin-top:12px; }
</style>
</head>
<body>
  <h1>两行间距对比</h1>
  <p>只有"主值"与"补充文字"之间的垂直间距不同，其余完全一致（主值加粗 14px、补充文字 12px 灰色、px-3、rounded、偏重阴影）。</p>
  <div class="row">
    <div class="col">
      <div class="label">A：2px（最紧凑）</div>
      <div class="input"><span class="value">0611</span><span class="icon">▾</span></div>
      <div class="panel a">
        <div class="option">
          <div class="main">06112478</div>
          <div class="hint">aSV746.0.0.n a2ZAS01 SSD Storage1</div>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="label">B：4px（推荐）</div>
      <div class="input"><span class="value">0611</span><span class="icon">▾</span></div>
      <div class="panel b">
        <div class="option">
          <div class="main">06112478</div>
          <div class="hint">aSV746.0.0.n a2ZAS01 SSD Storage1</div>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="label">C：12px（gap-3 的字面值）</div>
      <div class="input"><span class="value">0611</span><span class="icon">▾</span></div>
      <div class="panel c">
        <div class="option">
          <div class="main">06112478</div>
          <div class="hint">aSV746.0.0.n a2ZAS01 SSD Storage1</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
